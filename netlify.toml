# Netlify serves the static pages (control center, Learn page, explainer video)
# and proxies every API call to the backend on Render (see render.yaml).
# Set BACKEND_URL in Netlify (Site configuration -> Environment variables) to your Render URL,
# e.g. https://calle-rudder-api.onrender.com, then redeploy.
[build]
  command = "sh scripts/netlify_build.sh"
  publish = "dist"

[[headers]]
  for = "/rudder/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400"
