# Render blueprint: the backend (orchestrator + mock CRM in one web service, see app/combined.py).
# Render dashboard -> New -> Blueprint -> pick this repo. Netlify serves the pages and proxies the API here.
services:
  - type: web
    name: calle-rudder-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.combined:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: CALLE_MODE
        value: simulated
      # Real calls ("Call my phone") need this passcode on the public site. Render generates it;
      # read it in the dashboard (service -> Environment).
      - key: LIVE_PASSCODE
        generateValue: true
